<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviewer Sandbox Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111827; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-height: 100vh; }
      figure { margin: 0; background: #1f2937; min-width: 0; }
      figcaption { height: 42px; display: flex; align-items: center; padding: 0 16px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      img { width: 100%; height: auto; display: block; background: #f7f8fb; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source — selected Option 1</figcaption>
        <img src="/qa/source-option-1.png" alt="Selected Option 1 source design" />
      </figure>
      <figure>
        <figcaption>Implementation — final pass</figcaption>
        <img src="/qa/implementation-pass-2.png" alt="Reviewer Sandbox final implementation" />
      </figure>
    </main>
  </body>
</html>
