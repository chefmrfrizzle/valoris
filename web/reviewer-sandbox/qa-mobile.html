<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviewer Sandbox Mobile QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 32px; background: #111827; font-family: ui-sans-serif, system-ui, sans-serif; }
      figure { margin: 0; }
      figcaption { color: #fff; font-size: 12px; font-weight: 750; letter-spacing: .05em; padding: 0 0 10px; text-transform: uppercase; }
      iframe { width: 390px; height: 844px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 24px 80px rgba(0,0,0,.4); }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>Browser-rendered responsive viewport — 390 × 844 CSS px</figcaption>
      <iframe src="/" title="Valoris Reviewer Sandbox mobile viewport"></iframe>
    </figure>
  </body>
</html>
